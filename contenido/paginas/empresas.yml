titulo: "Trabajar con el GRSI"
bajada: "Qué sabe hacer el grupo, con qué equipamiento, qué hizo antes y cómo se contrata."
pasos:
  - titulo: "Contanos el problema"
    texto: "Por el formulario o al correo del grupo. No hace falta que esté definido."
  - titulo: "Reunión técnica"
    texto: "Acordamos alcance, plazos y entregables."
  - titulo: "Propuesta y modalidad"
    texto: "Presupuesto y la forma de contratación que mejor se ajuste."
  - titulo: "Ejecución e informe"
    texto: "Trabajo, informe final y transferencia de resultados."
modalidades:
  - nombre: "Convenio específico"
    cuando: "Trabajos de desarrollo o investigación conjunta de varios meses."
    firma: "Convenio entre la organización y la Facultad."
  - nombre: "Servicio tecnológico (STAN)"
    cuando: "Ensayos, mediciones o asesoramientos acotados y con entregable definido."
    firma: "Orden de servicio y presupuesto."
  - nombre: "Capacitación"
    cuando: "Cursos a medida para el personal de la organización."
    firma: "Presupuesto y programa del curso."
patrocinio: "Qué proyectos o actividades del grupo se pueden apoyar, qué visibilidad recibe quien aporta y cómo se formaliza."
preguntas:
  - pregunta: "¿Cómo se contrata un servicio del grupo?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: modalidad, tiempos habituales y a quién escribirle."
  - pregunta: "¿Qué plazos y costos tiene un trabajo típico?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: modalidad, tiempos habituales y a quién escribirle."
  - pregunta: "¿De quién son los resultados y qué pasa con la confidencialidad?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: modalidad, tiempos habituales y a quién escribirle."
  - pregunta: "¿Dictan capacitaciones a medida en la empresa?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: modalidad, tiempos habituales y a quién escribirle."
cierre_titulo: "¿Tu organización tiene un problema de automatización, control o robótica?"
cierre_texto: "Contanos el problema y te respondemos con una propuesta de trabajo."
