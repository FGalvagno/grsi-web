titulo: "Sumate al GRSI"
bajada: "Convocatorias con fecha de cierre, temas para tu trabajo final o tu tesis y los pasos para empezar."
pasos:
  - titulo: "Elegí un tema o una convocatoria"
    texto: "Mirá qué línea te interesa y quién la dirige."
  - titulo: "Escribile a quien dirige"
    texto: "Contá qué estudiás, en qué año estás y por qué te interesa. El correo está en cada ficha del equipo."
  - titulo: "Reunión y plan de trabajo"
    texto: "Definimos juntos el alcance, los plazos y el trámite que corresponda en la Facultad."
preguntas:
  - pregunta: "¿Puedo hacer mi Proyecto Integrador o mi Práctica Supervisada en el GRSI?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: quién puede, qué requisitos hay y a quién escribirle."
  - pregunta: "¿Reciben estudiantes de otras universidades o de intercambio?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: quién puede, qué requisitos hay y a quién escribirle."
  - pregunta: "¿Cómo consigo quien dirija mi beca doctoral o mi maestría?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: quién puede, qué requisitos hay y a quién escribirle."
  - pregunta: "¿Qué hago si ningún tema publicado me interesa?"
    respuesta: "Respuesta de ejemplo en dos o tres oraciones: quién puede, qué requisitos hay y a quién escribirle."
cierre_titulo: "¿Te interesa el grupo y no encontraste un tema?"
cierre_texto: "Escribinos contando qué estudiás y qué línea te interesa."
